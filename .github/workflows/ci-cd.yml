name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v2
    
    - name: Set up Python
      uses: actions/setup-python@v2
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flask flask-cors flask-sock
        pip install pytest
    
    - name: Set up Node.js
      uses: actions/setup-node@v2
      with:
        node-version: '16'
    
    - name: Install frontend dependencies
      run: |
        cd frontend
        npm install
    
    - name: Build frontend
      run: |
        cd frontend
        npm run build
        mkdir -p ../server/www
        cp -r build/* ../server/www/
    
    - name: Test server
      run: |
        cd server
        python -m pytest || true

    - name: Start server and expose with ngrok
      env:
        NGROK_AUTH_TOKEN: ${{ secrets.NGROK_AUTH_TOKEN }}
      run: |
        pip install pyngrok
        
        # 먼저 ngrok URL을 얻고 출력하는 스크립트 실행
        echo "::group::서버 및 ngrok 설정"
        python -c "
        import subprocess
        import time
        import os
        from pyngrok import ngrok
        
        # ngrok 인증 설정
        ngrok.set_auth_token('$NGROK_AUTH_TOKEN')
        
        # Flask 서버 시작
        print('Flask 서버를 시작합니다...')
        server_process = subprocess.Popen(['python', 'app.py'], cwd='server')
        
        # 서버 시작 대기
        print('서버가 시작될 때까지 잠시 대기합니다...')
        time.sleep(5)
        
        # ngrok 터널 생성
        http_tunnel = ngrok.connect(3000)
        tunnel_url = http_tunnel.public_url
        
        # 중요: URL을 특별 출력 형식으로 기록하여 쉽게 추출 가능하도록 함
        print(f'NGROK_URL={tunnel_url}')
        
        # GitHub 환경 파일에 URL 저장
        with open(os.environ.get('GITHUB_ENV', '/dev/null'), 'a') as f:
            f.write(f'NGROK_URL={tunnel_url}\\n')
        
        # GitHub 출력에 URL 저장
        with open(os.environ.get('GITHUB_OUTPUT', '/dev/null'), 'a') as f:
            f.write(f'ngrok_url={tunnel_url}\\n')
        
        print(f'서버가 시작되었습니다. 약 1분 동안 유지됩니다.')
        
        # 일정 시간 동안 실행 유지
        time.sleep(60)  # 1분 동안 유지
        
        # 종료 시 프로세스 정리
        server_process.terminate()
        ngrok.kill()
        print('서버와 ngrok 터널이 종료되었습니다.')
        "
        echo "::endgroup::"
      
    - name: PR 코멘트에 ngrok URL 추가
      uses: actions/github-script@v6
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        script: |
          // 로그에서 NGROK_URL= 라인 찾기
          const fs = require('fs');
          const output = require('child_process').execSync('grep NGROK_URL= $GITHUB_STEP_SUMMARY || echo "URL을 찾을 수 없습니다"').toString().trim();
          const match = output.match(/NGROK_URL=(.+)/);
          const url = match ? match[1] : process.env.NGROK_URL || '찾을 수 없음';
          
          const comment = `## 🔗 테스트 서버 URL
          
          테스트 서버가 약 1분 동안 다음 URL에서 접속 가능합니다:
          
          **${url}**
          
          > 참고: 이 URL은 일시적이며 약 1분 후에 자동으로 종료됩니다.`;
          
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: comment
          });