name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v2
    
    - name: Set up Python
      uses: actions/setup-python@v2
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flask flask-cors flask-sock
        pip install pytest
    
    - name: Set up Node.js
      uses: actions/setup-node@v2
      with:
        node-version: '16'
    
    - name: Install frontend dependencies
      run: |
        cd frontend
        npm install
    
    - name: Build frontend
      run: |
        cd frontend
        npm run build
        mkdir -p ../server/www
        cp -r build/* ../server/www/
    
    - name: Test server
      run: |
        cd server
        python -m pytest || true

    - name: Start server and expose with ngrok
      env:
        NGROK_AUTH_TOKEN: ${{ secrets.NGROK_AUTH_TOKEN }}
      run: |
        pip install pyngrok
        
        # 백그라운드에서 서버와 ngrok 실행
        nohup python -c "
        import subprocess
        import time
        import os
        from pyngrok import ngrok
        
        # ngrok 인증 설정
        ngrok.set_auth_token('$NGROK_AUTH_TOKEN')
        
        # Flask 서버 시작
        print('Flask 서버를 시작합니다...')
        server_process = subprocess.Popen(['python', 'app.py'], cwd='server')
        
        # 서버 시작 대기
        print('서버가 시작될 때까지 잠시 대기합니다...')
        time.sleep(5)
        
        # ngrok 터널 생성
        http_tunnel = ngrok.connect(3000)
        tunnel_url = http_tunnel.public_url
        print(f'서버가 시작되었습니다. 약 2분 동안 유지됩니다.')
        print(f'ngrok URL: {tunnel_url}')

        # GitHub Actions에서 확인할 수 있도록 출력
        try:
          with open(os.environ.get('GITHUB_STEP_SUMMARY', '/dev/null'), 'a') as f:
              f.write(f'## 서버 접속 정보\\n')
              f.write(f'서버 URL: {tunnel_url}\\n')
          except Exception as e:
              print(f'요약 작성 중 오류 발생: {e}')
        
        # 2분 후 자동 종료를 위한 타이머 스크립트
        time.sleep(120)  # 2분 동안 유지
        
        # 종료 시 프로세스 정리
        server_process.terminate()
        ngrok.kill()
        print('서버와 ngrok 터널이 종료되었습니다.')
        " > server_log.txt 2>&1 &
        
        # ngrok URL을 가져와서 출력
        sleep 10
        echo "서버가 백그라운드에서 시작되었습니다. 약 2분 동안 유지됩니다."
        grep "ngrok URL:" server_log.txt || echo "ngrok URL을 찾을 수 없습니다."
        
        # 성공 상태로 즉시 종료
        exit 0