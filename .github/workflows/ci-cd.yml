name: CI/CD Pipeline
on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v2
    
    - name: Set up Python
      uses: actions/setup-python@v2
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flask flask-cors flask-sock
        pip install pytest
    
    - name: Set up Node.js
      uses: actions/setup-node@v2
      with:
        node-version: '16'
    
    - name: Install frontend dependencies
      run: |
        cd frontend
        npm install
    
    - name: Build frontend
      run: |
        cd frontend
        npm run build
        mkdir -p ../server/www
        cp -r build/* ../server/www/
    
    - name: Test server
      run: |
        cd server
        python -m pytest || true
    
    - name: Start server and expose with ngrok
      if: github.event_name == 'pull_request'
      env:
        NGROK_AUTH_TOKEN: ${{ secrets.NGROK_AUTH_TOKEN }}
      run: |
        pip install pyngrok
        python -c "from pyngrok import ngrok; ngrok.set_auth_token('$NGROK_AUTH_TOKEN'); url = ngrok.connect(3000); print(f'Server available at: {url}')" &
        cd server
        python app.py &
        sleep 15
        echo "서버가 시작되었습니다. 약 15분 동안 유지됩니다."
        echo "ngrok URL을 확인하세요."